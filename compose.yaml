services:
  mcp:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      YANDEX_TOKEN_FILE: /data/tokens.json
      YANDEX_TOKEN_ENCRYPTION_KEY_FILE: /secrets/token-key
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_READ_ONLY: ${YANDEX_READ_ONLY:-true}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?Set MCP_BEARER_TOKEN}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?Set HTTPS public origin}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: bind
        source: ${YANDEX_TOKEN_DIRECTORY:?Set prepared token directory}
        target: /data
      - type: bind
        source: ${YANDEX_TOKEN_ENCRYPTION_KEY_FILE:?Set key file}
        target: /secrets/token-key
        read_only: true
    restart: unless-stopped
